<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANGOSORT Live Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .content {
            padding: 30px;
        }
        
        .video-container {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
            aspect-ratio: 4 / 3;
        }
        
        .video-container img {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-card.unripe {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        
        .stat-card.ripe {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .stat-card.overripe {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
        }
        
        .stat-card.rotten {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
        }
        
        .info {
            background: #f0f9ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            font-size: 0.9em;
            color: #333;
        }
        
        .status {
            text-align: center;
            color: #666;
            font-size: 0.85em;
            margin-top: 10px;
        }
        
        .status.online {
            color: #10b981;
            font-weight: bold;
        }
        
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .content {
                padding: 15px;
            }
            
            .stat-number {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🥭 MANGOSORT</h1>
            <p>Live Mango Detection & Classification</p>
        </div>
        
        <div class="content">
            <div class="video-container">
                <img id="videoFeed" src="http://localhost:5000/api/video" alt="Video Stream">
            </div>
            
            <div class="stats-grid">
                <div class="stat-card unripe">
                    <div class="stat-label">Unripe</div>
                    <div class="stat-number" id="unripeCount">0</div>
                </div>
                <div class="stat-card ripe">
                    <div class="stat-label">Ripe</div>
                    <div class="stat-number" id="ripeCount">0</div>
                </div>
                <div class="stat-card overripe">
                    <div class="stat-label">Overripe</div>
                    <div class="stat-number" id="overripeCount">0</div>
                </div>
                <div class="stat-card rotten">
                    <div class="stat-label">Rotten</div>
                    <div class="stat-number" id="rottenCount">0</div>
                </div>
            </div>
            
            <div class="info">
                <strong>ℹ️ How it works:</strong><br>
                Point your camera at mangoes. The YOLO AI model will detect and classify them in real-time. 
                Each detected mango is counted and colored by ripeness level.
            </div>
            
            <div class="status" id="status">
                <span>⏳ Connecting...</span>
            </div>
        </div>
    </div>
    
    <script>
        async function updateDetections() {
            try {
                const response = await fetch('http://localhost:5000/api/detections');
                const data = await response.json();
                
                document.getElementById('unripeCount').textContent = data.unripe;
                document.getElementById('ripeCount').textContent = data.ripe;
                document.getElementById('overripeCount').textContent = data.overripe;
                document.getElementById('rottenCount').textContent = data.rotten;
                
                const status = document.getElementById('status');
                status.innerHTML = '<span class="online">🟢 Live Detection Running</span>';
            } catch (e) {
                const status = document.getElementById('status');
                status.innerHTML = '<span>⚠️ Connection Error: ' + e.message + '</span>';
            }
        }
        
        // Update counts every 500ms
        setInterval(updateDetections, 500);
        updateDetections();
    </script>
</body>
</html>
